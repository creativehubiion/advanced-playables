<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="ad.size" content="width=320,height=480">
<title>Tilt Racer · iion playable demo</title>
<script src="mraid.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#0a0e1a;touch-action:none}

  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:700;letter-spacing:.04em;font-size:14px;z-index:5;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #hud .label{font-size:9px;font-weight:600;color:#7d8aa8;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:1px}
  #hud .val{font-size:18px;font-variant-numeric:tabular-nums}
  #score-val{color:#ffd34d}
  #time-val{color:#5dd9ff}

  /* input mode pill */
  #input-pill{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);padding:4px 10px;border-radius:999px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9aa6c2;pointer-events:none;z-index:6;font-weight:600}

  /* overlays */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:radial-gradient(circle at 50% 30%,#1b2240 0%,#0a0e1a 80%);z-index:10;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay h1{font-size:34px;font-weight:800;letter-spacing:.04em;margin-bottom:8px;background:linear-gradient(90deg,#5dd9ff,#a47bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-fill-color:transparent}
  .overlay h2{font-size:22px;font-weight:700;color:#ffd34d;margin:6px 0 22px;letter-spacing:.02em}
  .overlay p{font-size:14px;color:#9aa6c2;line-height:1.5;max-width:320px;margin-bottom:28px}
  .overlay .arrows{font-size:30px;letter-spacing:18px;color:#5dd9ff;margin-bottom:14px;animation:wobble 1.4s ease-in-out infinite;text-shadow:0 0 12px rgba(93,217,255,.55)}
  @keyframes wobble{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  .btn{background:linear-gradient(90deg,#5dd9ff,#a47bff);color:#0a0e1a;border:none;padding:14px 38px;border-radius:999px;font-size:15px;font-weight:800;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;box-shadow:0 8px 28px rgba(93,217,255,.35);min-width:200px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .btn:active{transform:scale(.97)}
  .small{font-size:11px;color:#5d6885;margin-top:18px;letter-spacing:.05em}
  .stat-box{display:flex;gap:32px;margin:8px 0 28px}
  .stat-box .stat .lbl{font-size:10px;color:#7d8aa8;letter-spacing:.12em;text-transform:uppercase}
  .stat-box .stat .num{font-size:28px;font-weight:800;color:#ffd34d;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="stage"><canvas id="game" width="360" height="640"></canvas></div>

<div id="hud" style="display:none">
  <div><span class="label">Score</span><span id="score-val" class="val">0</span></div>
  <div><span class="label">Time</span><span id="time-val" class="val">25</span></div>
</div>
<div id="input-pill" style="display:none">— input</div>

<!-- START / PERMISSION GATE -->
<div id="ov-start" class="overlay">
  <div class="arrows">↶ ↷</div>
  <h1>TILT RACER</h1>
  <p>Tilt your phone left and right to steer.<br>Dodge the cars. Grab the coins.</p>
  <button id="btn-start" class="btn">Tap to start</button>
  <div class="small">Demo · iion advanced playables</div>
</div>

<!-- GAME OVER -->
<div id="ov-end" class="overlay" style="display:none">
  <h1 id="end-title">NICE RUN</h1>
  <div class="stat-box">
    <div class="stat"><div class="lbl">Score</div><div id="end-score" class="num">0</div></div>
    <div class="stat"><div class="lbl">Coins</div><div id="end-coins" class="num">0</div></div>
  </div>
  <button id="btn-cta" class="btn">Install Now</button>
  <button id="btn-replay" style="background:none;border:none;color:#7d8aa8;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:18px;cursor:pointer">Play again</button>
</div>

<script>
(() => {
  'use strict';

  // -------------------- canvas + sizing --------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 360, H = 640;       // logical resolution
  const ROAD_LEFT = 40, ROAD_RIGHT = 320, ROAD_W = ROAD_RIGHT - ROAD_LEFT;

  function fitCanvas() {
    const ar = W / H;
    const winAr = innerWidth / innerHeight;
    let w, h;
    if (winAr > ar) { h = innerHeight; w = h * ar; }
    else            { w = innerWidth;  h = w / ar; }
    canvas.style.width  = `${w}px`;
    canvas.style.height = `${h}px`;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', fitCanvas);
  fitCanvas();

  // -------------------- state --------------------
  const state = {
    phase: 'idle',          // idle | playing | over
    inputMode: 'pending',   // gyro | touch | pending
    timeLeft: 25,
    score: 0,
    coins: 0,
    distance: 0,
    speed: 360,             // base scroll speed (px/s, virtual)
    player: { x: W / 2, y: H - 110, w: 38, h: 64, tilt: 0 },
    playerVx: 0,            // gyro-driven velocity
    playerTargetX: W / 2,   // touch-driven target
    obstacles: [],
    coinsArr: [],
    roadOffset: 0,
    spawnTimer: 0,
    coinTimer: 0,
    explosion: null,
    calib: null,            // gyro calibration baseline (gamma at first event)
    gyroEvents: 0
  };

  // -------------------- input: gyro --------------------
  const orientApi = typeof DeviceOrientationEvent !== 'undefined';
  const orientReq = orientApi && typeof DeviceOrientationEvent.requestPermission === 'function';

  function bindGyro() {
    addEventListener('deviceorientation', onGyro, true);
    setTimeout(() => {
      if (state.gyroEvents === 0 && state.inputMode === 'pending') {
        // Silently blocked (Permissions Policy / iframe allow= missing).
        useTouchMode('blocked');
      }
    }, 1500);
  }

  function onGyro(e) {
    state.gyroEvents++;
    if (state.gyroEvents === 1) {
      state.inputMode = 'gyro';
      updatePill();
    }
    if (state.calib === null && typeof e.gamma === 'number') state.calib = e.gamma;
    if (typeof e.gamma === 'number' && state.calib !== null) {
      const raw = e.gamma - state.calib;          // tilt off baseline, deg
      const norm = Math.max(-1, Math.min(1, raw / 25)); // -25°..25° → -1..1
      const target = norm * 360;                  // px/s velocity
      // low-pass smoothing
      state.playerVx = state.playerVx * 0.78 + target * 0.22;
    }
  }

  async function startGyroFlow() {
    if (!orientApi) { useTouchMode('no-api'); return; }
    if (orientReq) {
      try {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') { useTouchMode('denied'); return; }
      } catch { useTouchMode('error'); return; }
    }
    bindGyro();
  }

  // -------------------- input: touch fallback --------------------
  function useTouchMode(reason) {
    state.inputMode = 'touch';
    updatePill(reason);
  }
  function updatePill(reason) {
    const pill = document.getElementById('input-pill');
    pill.style.display = '';
    if (state.inputMode === 'gyro')      pill.textContent = 'Tilt to steer';
    else if (state.inputMode === 'touch')pill.textContent = 'Drag to steer';
    else                                  pill.textContent = '— input —';
  }
  function onTouch(e) {
    if (!e.touches || !e.touches[0]) return;
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    const cx = (t.clientX - r.left) * (W / r.width);
    state.playerTargetX = cx;
    e.preventDefault();
  }
  canvas.addEventListener('touchstart', onTouch, { passive: false });
  canvas.addEventListener('touchmove',  onTouch, { passive: false });

  // -------------------- spawn --------------------
  function spawnObstacle() {
    const lane = Math.floor(Math.random() * 3);
    const x = ROAD_LEFT + ROAD_W * (0.16 + lane * 0.34);
    const colors = ['#e3445a', '#ff7a30', '#a47bff', '#3ec48f'];
    state.obstacles.push({
      x, y: -90, w: 38, h: 62,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  function spawnCoin() {
    const x = ROAD_LEFT + 20 + Math.random() * (ROAD_W - 40);
    state.coinsArr.push({ x, y: -20, r: 9, t: 0 });
  }

  // -------------------- update --------------------
  function update(dt) {
    if (state.phase !== 'playing') return;

    // timer
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      endGame(true);
      return;
    }
    document.getElementById('time-val').textContent = Math.ceil(state.timeLeft);

    // road scroll + difficulty ramp
    const elapsed = 25 - state.timeLeft;
    state.speed = 360 + elapsed * 12;             // accel over time
    state.roadOffset = (state.roadOffset + state.speed * dt) % 60;
    state.distance += state.speed * dt;

    // player movement
    const p = state.player;
    if (state.inputMode === 'gyro') {
      p.x += state.playerVx * dt;
      p.tilt = state.playerVx / 360 * 0.35;       // visual lean
    } else if (state.inputMode === 'touch') {
      p.x += (state.playerTargetX - p.x) * 0.18;
      p.tilt = (state.playerTargetX - p.x) / 60;
    }
    const minX = ROAD_LEFT + p.w / 2 + 4;
    const maxX = ROAD_RIGHT - p.w / 2 - 4;
    if (p.x < minX) { p.x = minX; state.playerVx = Math.max(0, state.playerVx); }
    if (p.x > maxX) { p.x = maxX; state.playerVx = Math.min(0, state.playerVx); }

    // spawn
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnObstacle();
      state.spawnTimer = Math.max(0.45, 1.1 - elapsed * 0.025);
    }
    state.coinTimer -= dt;
    if (state.coinTimer <= 0) {
      spawnCoin();
      state.coinTimer = 0.6 + Math.random() * 0.6;
    }

    // move + collide obstacles
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
      const o = state.obstacles[i];
      o.y += state.speed * dt;
      if (o.y > H + 80) { state.obstacles.splice(i, 1); continue; }
      // AABB collision (slightly inset)
      if (Math.abs(o.x - p.x) < (o.w + p.w) * 0.42 &&
          Math.abs(o.y - p.y) < (o.h + p.h) * 0.42) {
        crash(o);
        return;
      }
    }
    // move + collect coins
    for (let i = state.coinsArr.length - 1; i >= 0; i--) {
      const c = state.coinsArr[i];
      c.y += state.speed * dt;
      c.t += dt;
      if (c.y > H + 30) { state.coinsArr.splice(i, 1); continue; }
      const dx = c.x - p.x, dy = c.y - p.y;
      if (dx * dx + dy * dy < (c.r + p.w * 0.45) ** 2) {
        state.coins++;
        state.score += 50;
        beep(880, 0.06, 0.18);
        state.coinsArr.splice(i, 1);
      }
    }

    // distance score
    state.score = Math.floor(state.distance * 0.05) + state.coins * 50;
    document.getElementById('score-val').textContent = state.score;
  }

  function crash(o) {
    state.explosion = { x: o.x, y: o.y, t: 0 };
    beep(120, 0.4, 0.4, 'sawtooth');
    if (navigator.vibrate) navigator.vibrate([60, 30, 90]);
    setTimeout(() => endGame(false), 700);
  }

  // -------------------- render --------------------
  function render() {
    // sky gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b2240');
    g.addColorStop(1, '#080b16');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // grass shoulders w/ scrolling chevrons
    ctx.fillStyle = '#0e1428';
    ctx.fillRect(0, 0, ROAD_LEFT, H);
    ctx.fillRect(ROAD_RIGHT, 0, W - ROAD_RIGHT, H);

    // road
    ctx.fillStyle = '#181f38';
    ctx.fillRect(ROAD_LEFT, 0, ROAD_W, H);

    // road edge stripes
    ctx.fillStyle = '#5dd9ff';
    ctx.fillRect(ROAD_LEFT - 2, 0, 2, H);
    ctx.fillRect(ROAD_RIGHT,    0, 2, H);

    // dashed lane markers
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    const laneXs = [ROAD_LEFT + ROAD_W * 0.33, ROAD_LEFT + ROAD_W * 0.66];
    for (const lx of laneXs) {
      for (let y = -60 + state.roadOffset; y < H; y += 60) {
        ctx.fillRect(lx - 1.5, y, 3, 28);
      }
    }

    // coins
    for (const c of state.coinsArr) {
      const wob = 1 + Math.sin(c.t * 8) * 0.15;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(wob, 1);
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff7c2';
      ctx.beginPath(); ctx.arc(-2, -2, c.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // obstacles (cars)
    for (const o of state.obstacles) drawCar(o.x, o.y, o.w, o.h, o.color, 0, true);

    // player
    if (state.phase !== 'over' || !state.explosion) {
      drawCar(state.player.x, state.player.y, state.player.w, state.player.h, '#5dd9ff', state.player.tilt, false);
    }

    // explosion
    if (state.explosion) {
      const e = state.explosion;
      e.t += 1 / 60;
      const rad = e.t * 220;
      ctx.fillStyle = `rgba(255,160,40,${Math.max(0, 1 - e.t * 1.4)})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, rad, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - e.t * 2)})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, rad * 0.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawCar(x, y, w, h, color, tilt, oncoming) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    roundRect(-w/2 + 2, -h/2 + 4, w, h, 8); ctx.fill();
    // body
    ctx.fillStyle = color;
    roundRect(-w/2, -h/2, w, h, 8); ctx.fill();
    // windshield
    ctx.fillStyle = 'rgba(10,14,26,.85)';
    roundRect(-w/2 + 5, -h/2 + (oncoming ? h*0.55 : 8), w - 10, h * 0.3, 4); ctx.fill();
    // headlights
    ctx.fillStyle = oncoming ? '#fff7c2' : '#0a0e1a';
    roundRect(-w/2 + 4, oncoming ? -h/2 + 4 : h/2 - 8, 8, 4, 2); ctx.fill();
    roundRect( w/2 - 12, oncoming ? -h/2 + 4 : h/2 - 8, 8, 4, 2); ctx.fill();
    // roof stripe
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    roundRect(-2, -h/2 + 8, 4, h - 16, 2); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // -------------------- main loop --------------------
  let lastT = 0;
  function tick(t) {
    const dt = Math.min(0.05, lastT ? (t - lastT) / 1000 : 0);
    lastT = t;
    update(dt);
    render();
    requestAnimationFrame(tick);
  }

  // -------------------- audio (synth) --------------------
  let actx = null;
  function beep(freq, dur, vol = 0.2, type = 'square') {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch {}
  }

  // -------------------- flow --------------------
  function startGame() {
    state.phase = 'playing';
    state.timeLeft = 25;
    state.score = 0;
    state.coins = 0;
    state.distance = 0;
    state.player.x = W / 2;
    state.playerTargetX = W / 2;
    state.playerVx = 0;
    state.obstacles.length = 0;
    state.coinsArr.length = 0;
    state.explosion = null;
    state.spawnTimer = 1;
    state.coinTimer = 0.4;
    document.getElementById('hud').style.display = '';
    document.getElementById('ov-start').style.display = 'none';
    document.getElementById('ov-end').style.display = 'none';
  }

  function endGame(success) {
    state.phase = 'over';
    document.getElementById('end-title').textContent = success ? 'NICE RUN!' : 'CRASHED';
    document.getElementById('end-score').textContent = state.score;
    document.getElementById('end-coins').textContent = state.coins;
    document.getElementById('ov-end').style.display = '';
    document.getElementById('hud').style.display = 'none';
  }

  function clickThrough() {
    const url = window.landingPageUrl || 'https://creativehubiion.github.io/advanced-playables/';
    try {
      if (window.mraid && typeof window.mraid.open === 'function') {
        window.mraid.open(url);
        return;
      }
    } catch {}
    try { window.open(url, '_blank'); } catch {}
  }

  document.getElementById('btn-start').addEventListener('click', async () => {
    await startGyroFlow();
    if (state.inputMode === 'pending') updatePill();
    startGame();
  });
  document.getElementById('btn-cta').addEventListener('click', clickThrough);
  document.getElementById('btn-replay').addEventListener('click', () => {
    state.calib = null; state.gyroEvents = 0;
    startGame();
  });

  // pause on viewability loss (MRAID)
  if (window.mraid) {
    try {
      window.mraid.addEventListener?.('viewableChange', (v) => {
        // No hard pause logic for now — game is short. Could pause loop here.
      });
    } catch {}
  }

  requestAnimationFrame(tick);
})();
</script>
